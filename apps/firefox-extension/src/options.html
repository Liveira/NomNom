<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NomNom</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light dark; font-family: system-ui, 'Segoe UI', sans-serif; }
      body { max-width: 520px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
      h1 { font-size: 22px; margin: 0 0 6px; }
      p { margin: 8px 0; }
      .status { padding: 12px 14px; border-radius: 12px; background: rgba(128, 128, 128, 0.14); margin: 18px 0; }
      .status[data-ok='true'] { background: rgba(43, 166, 64, 0.16); }
      .status[data-ok='false'] { background: rgba(229, 72, 77, 0.16); }
      button { font: inherit; padding: 8px 16px; border-radius: 10px; border: 0; background: #ffb070; color: #2b1608; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: default; }
      ul { padding-left: 20px; }
    </style>
  </head>
  <body>
    <h1>NomNom for Firefox</h1>
    <p>Adds a download button to videos and posts on YouTube, X, Instagram and Reddit. The links go to the NomNom app on this computer and nowhere else.</p>
    <div id="status" class="status" role="status" aria-live="polite" data-ok="">Checking…</div>
    <button id="test" type="button">Check again</button>
    <h2 style="font-size:16px;margin-top:28px">If it says NomNom isn't set up</h2>
    <ul>
      <li>Install and open NomNom.</li>
      <li>Go to Settings, then Browser.</li>
      <li>Press Connect Firefox.</li>
    </ul>
    <script src="options.js"></script>
  </body>
</html>
