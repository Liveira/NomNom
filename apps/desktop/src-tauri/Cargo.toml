[package]
name = "nomnom"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nomnom-core = { path = "../../../crates/nomnom-core" }
nomnom-tools = { path = "../../../crates/nomnom-tools" }
nomnom-downloads = { path = "../../../crates/nomnom-downloads" }
nomnom-ipc = { path = "../../../crates/nomnom-ipc" }
nomnom-win = { path = "../../../crates/nomnom-win" }
nomnom-organizer = { path = "../../../crates/nomnom-organizer" }
notify = "8"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
async-trait.workspace = true
anyhow.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }
