[package]
name = "nomnom"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nomnom-core = { path = "../../../crates/nomnom-core" }
nomnom-tools = { path = "../../../crates/nomnom-tools" }
nomnom-downloads = { path = "../../../crates/nomnom-downloads" }
nomnom-ipc = { path = "../../../crates/nomnom-ipc" }
nomnom-organizer = { path = "../../../crates/nomnom-organizer" }
nomnom-converter = { path = "../../../crates/nomnom-converter" }
nomnom-storage = { path = "../../../crates/nomnom-storage" }
nomnom-activity = { path = "../../../crates/nomnom-activity" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-util.workspace = true
notify = "8"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
async-trait.workspace = true
anyhow.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
nomnom-win = { path = "../../../crates/nomnom-win" }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[target.'cfg(not(windows))'.dependencies]
nomnom-linux = { path = "../../../crates/nomnom-linux" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
