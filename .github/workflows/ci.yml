name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/desktop
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        shell: pwsh
        run: |
          cargo test --workspace --no-fail-fast 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $bad = (Select-String -CaseSensitive -Path test.log -Pattern "... FAILED|panicked at|^error" | Select-Object -First 8 | ForEach-Object { $_.Line.Trim() }) -join " || "
            Write-Output "::error::$bad"
          }
          exit $code
      - run: npm run check
      - run: npm test
      - run: npm run build -w @nomnom/firefox-extension
      - run: npm run check -w @nomnom/firefox-extension
      - run: npm test -w @nomnom/firefox-extension
      - run: npx web-ext lint --source-dir apps/firefox-extension/dist
        continue-on-error: true # the only warning is about Firefox for Android, which isn't supported

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: bash -n scripts/build-linux.sh scripts/bench-linux.sh packaging/arch/PKGBUILD
      - run: npm ci
      - run: npm run build -w apps/desktop
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --no-fail-fast
      - run: npm run check
      - run: npm test
      - run: npm run build -w @nomnom/firefox-extension
      - run: npm run check -w @nomnom/firefox-extension
      - run: npm test -w @nomnom/firefox-extension
