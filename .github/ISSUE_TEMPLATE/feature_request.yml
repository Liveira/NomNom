name: Feature request
description: An idea to make NomNom better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the task first. A solution can come after.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like NomNom to do?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it today?
      description: Other programs or workarounds you use now.
  - type: dropdown
    id: system
    attributes:
      label: Where do you use NomNom?
      multiple: true
      options:
        - Windows 11
        - Arch Linux
        - Debian / Ubuntu
        - Other Linux
